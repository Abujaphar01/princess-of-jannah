version: "3.8"

services:
  princess-of-jannah-engine:
    build: .
    container_name: princess-of-jannah-engine
    restart: unless-stopped
    ports:
      - "7860:10000"
    env_file:
      - .env
    environment:
      - PORT=10000
      - WHATSAPP_ADMIN_GROUP_NAME=Princess of Jannah Posts
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./data:/app/data
      - ./media_vault:/app/media_vault
