name: Princess of Jannah 24/7 Cloud Engagement & Render Keep-Alive

on:
  schedule:
    # Runs every 14 minutes 24/7 in GitHub Cloud (keeps Render WhatsApp bot awake & invites new commenters!)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  cloud-engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Wake / Keep-Alive 24/7 Cloud WhatsApp Server (Render)
        run: |
          curl -fsS --max-time 25 https://princess-of-jannah-engine.onrender.com/health || echo "Render service not yet deployed or waking up"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Minimal Dependencies
        run: pip install requests python-dotenv

      - name: Auto-Invite & Reply to New Reel Commenters
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python cloud_comment_inviter.py

      - name: Persist Replied Comments State
        run: |
          if [ -f data/replied_comments.json ]; then
            git config --global user.name "PrincessOfJannah Bot"
            git config --global user.email "bot@princessofjannah.local"
            git add data/replied_comments.json
            git commit -m "Auto: Update replied comments state [skip ci]" || echo "No new comments"
            git push || echo "Push skipped"
          fi
